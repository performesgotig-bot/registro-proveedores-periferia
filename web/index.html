<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de proveedores | Periferia</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", sans-serif; color: #17243b; background: #f3f6fa; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(940px, 100%); height: min(780px, calc(100vh - 48px)); display: flex; flex-direction: column; background: #fff; border: 1px solid #e1e7ef; border-radius: 18px; box-shadow: 0 16px 48px #243a5a14; overflow: hidden; }
      header { padding: 22px 26px; border-bottom: 1px solid #e9edf3; display: flex; justify-content: space-between; align-items: center; }
      header h1 { font-size: 19px; margin: 0 0 4px; }
      header p { color: #718096; margin: 0; font-size: 13px; }
      #health { font-size: 12px; color: #7a8798; }
      #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
      .message { max-width: min(760px, 92%); border-radius: 14px; padding: 14px 16px; white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
      .user { align-self: flex-end; color: #fff; background: #2458a6; }
      .assistant { align-self: flex-start; background: #f1f4f8; }
      .thinking { color: #738198; font-style: italic; }
      .confirmation { border: 2px solid #dfaa32; background: #fff9e9; }
      .tool { align-self: flex-start; width: min(760px, 92%); border: 1px solid #dfe6ef; border-radius: 10px; padding: 10px 12px; background: #fbfcfe; font-size: 12px; color: #46566d; }
      .tool summary { cursor: pointer; font-weight: 650; }
      .tool pre { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 Consolas, monospace; }
      form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid #e9edf3; }
      textarea { flex: 1; min-height: 48px; max-height: 120px; resize: vertical; border: 1px solid #ced7e3; border-radius: 10px; padding: 12px; font: inherit; }
      button { border: 0; border-radius: 10px; padding: 0 20px; color: #fff; background: #2458a6; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      @media (max-width: 600px) { body { padding: 0; } main { height: 100vh; border-radius: 0; } header { padding: 18px; } #messages { padding: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Registro de proveedores</h1>
          <p>Asistente de preparación y revisión administrativa</p>
        </div>
        <span id="health">Conectando…</span>
      </header>
      <section id="messages" aria-live="polite">
        <div class="message assistant">Hola. Puedo leer una solicitud, completar sus campos con los datos maestros y preparar un paquete para revisión humana. ¿Qué caso deseas procesar?</div>
      </section>
      <form id="chat">
        <textarea id="input" placeholder="Ej.: Procesa ec-corp-andina y prepara el paquete para firma." required></textarea>
        <button id="send" type="submit">Enviar</button>
      </form>
    </main>
    <script>
      const messages = document.querySelector("#messages");
      const form = document.querySelector("#chat");
      const input = document.querySelector("#input");
      const send = document.querySelector("#send");
      let sessionId;

      function addMessage(text, role, confirmation = false) {
        const element = document.createElement("div");
        element.className = `message ${role}${confirmation ? " confirmation" : ""}`;
        element.textContent = text;
        messages.append(element);
        messages.scrollTop = messages.scrollHeight;
        return element;
      }

      fetch("/api/health").then((response) => response.json()).then((health) => {
        document.querySelector("#health").textContent = `Listo · ${health.model}`;
      }).catch(() => {
        document.querySelector("#health").textContent = "Backend no disponible";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || send.disabled) return;
        addMessage(message, "user");
        input.value = "";
        send.disabled = true;
        const thinking = addMessage("Procesando…", "assistant thinking");
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ sessionId, message }),
          });
          const result = await response.json();
          thinking.remove();
          sessionId = result.sessionId || sessionId;
          for (const call of result.toolCalls || []) {
            const details = document.createElement("details");
            details.className = "tool";
            const summary = document.createElement("summary");
            summary.textContent = `Herramienta: ${call.name}`;
            const pre = document.createElement("pre");
            pre.textContent = `Argumentos:\n${JSON.stringify(call.arguments, null, 2)}\n\nResultado:\n${JSON.stringify(call.result, null, 2)}`;
            details.append(summary, pre);
            messages.append(details);
          }
          addMessage(result.reply || result.error || "No recibí una respuesta.", "assistant", Boolean(result.needsConfirmation));
        } catch {
          thinking.remove();
          addMessage("No se pudo contactar al servidor. Inténtalo de nuevo.", "assistant");
        } finally {
          send.disabled = false;
          input.focus();
          messages.scrollTop = messages.scrollHeight;
        }
      });
    </script>
  </body>
</html>
